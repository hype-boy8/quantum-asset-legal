# 국내 종목 목록(data/kr_stocks.tsv)을 매주 새로 만든다.
# Quantum Asset 앱이 일주일에 한 번 이 파일을 확인해, 새로 상장한 종목(특히 ETF)을 이름으로 찾을 수 있게 한다.
name: 종목 목록 갱신

on:
  schedule:
    - cron: "0 21 * * 0" # 매주 월요일 오전 6시 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 목록 받기
        run: python3 tools/update_stock_list.py data/kr_stocks.tsv
      - name: 바뀐 종목이 있으면 올리기
        run: |
          # 날짜 줄만 바뀐 건 올리지 않는다
          if git diff --quiet -I '^#updated' -- data/kr_stocks.tsv; then
            echo "바뀐 종목 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kr_stocks.tsv
          git commit -m "종목 목록 갱신 $(date +%F)"
          git push
